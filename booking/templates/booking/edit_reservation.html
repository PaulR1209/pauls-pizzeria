{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="row">
    <div class="container col-11 col-md-7 col-lg-5 col-xl-4 p-3">
        <h1 class="menu-title">Edit Booking</h1>
        <form class="text-center" method="post" action="{% url 'edit_reservation' reservation.id %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary home-btn" type="submit">Save Changes</button>
        </form>
    </div>
</div>
{% endblock content %}
